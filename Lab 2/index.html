
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Registration Form -->
        <div id="registrationPage">
            <h2>Course Registration</h2>
            <p class="intro">Enter your details to register for a course.</p>

            <form id="registrationForm">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
                <p id="nameError"></p>

                <label for="studentId">Student ID</label>
                <input type="number" id="studentId" min="1" placeholder="Enter your student ID" required>
                <p id="idError"></p>

                <label for="programme">Programme</label>
                <select id="programme" required>
                    <option value="">Select your programme</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Business Administration">Business Administration</option>
                </select>
                <p id="programmeError"></p>

                <label for="course">Course</label>
                <input type="text" id="course" placeholder="Enter course name" required>
                <p id="courseError"></p>

                <button type="submit">Register Course</button>

            </form>
        </div>


        <!-- Confirmation Page -->
        <div id="confirmationPage">

            <div class="success-icon">✓</div>

            <h2>Registration Successful!</h2>
            <p class="intro">You have been registered for the following course.</p>

            <div class="details">
                <p><strong>Name:</strong> <span id="displayName"></span></p>
                <p><strong>Student ID:</strong> <span id="displayId"></span></p>
                <p><strong>Programme:</strong> <span id="displayProgramme"></span></p>
                <p><strong>Course:</strong> <span id="displayCourse"></span></p>
            </div>

            <button onclick="goBack()">Register Another Course</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
